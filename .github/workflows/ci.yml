name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-x64-gcc:
    name: ubuntu-latest / gcc
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: ubuntu-latest
      cxx: g++

  linux-x64-clang:
    name: ubuntu-latest / clang
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: ubuntu-latest
      cxx: clang++

  linux-arm-gcc:
    name: ubuntu-24.04-arm / gcc
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: ubuntu-24.04-arm
      cxx: g++

  linux-arm-clang:
    name: ubuntu-24.04-arm / clang
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: ubuntu-24.04-arm
      cxx: clang++

  macos-arm:
    name: macos-latest / AppleClang
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: macos-latest
      cxx: clang++

  macos-intel:
    name: macos-15-intel / AppleClang
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: macos-15-intel
      cxx: clang++

  windows:
    name: windows-latest / MSVC
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cpp-leg.yml
    with:
      runner: windows-latest
      cxx: cl

  gate:
    name: CI gate
    needs: [linux-x64-gcc, linux-x64-clang, linux-arm-gcc, linux-arm-clang, macos-arm, macos-intel, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Test the fail-closed gate
        run: python3 scripts/test-ci-gate.py
      - name: List and require every leg
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_LEGS: '{"linux-x64-gcc": "ubuntu-latest / gcc", "linux-x64-clang": "ubuntu-latest / clang", "linux-arm-gcc": "ubuntu-24.04-arm / gcc", "linux-arm-clang": "ubuntu-24.04-arm / clang", "macos-arm": "macos-latest / AppleClang", "macos-intel": "macos-15-intel / AppleClang", "windows": "windows-latest / MSVC"}'
        run: python3 scripts/ci-gate.py
