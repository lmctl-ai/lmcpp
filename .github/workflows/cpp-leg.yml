name: C++ platform leg
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      cxx:
        required: true
        type: string
permissions:
  contents: read
env:
  LMAPI_REF: e1ccceab82680437b81e80fd17f11cf7d17ecfd4
jobs:
  build-test:
    name: Build, conformance and consumer
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout lmcpp
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: lmcpp
      - name: Checkout pinned lmapi conformance vectors
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: lmctl-ai/lmapi
          ref: ${{ env.LMAPI_REF }}
          path: lmapi
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nlohmann-json3-dev g++ clang
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nlohmann-json
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install nlohmann-json:x64-windows
          "JSON_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
      - name: Configure
        working-directory: lmcpp
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ inputs.cxx }} -DCMAKE_PREFIX_PATH="$JSON_PREFIX" -DLMCPP_REQUIRE_CONFORMANCE=ON -DLMAPI_DIR=../lmapi
      - name: Build
        working-directory: lmcpp
        run: cmake --build build --parallel 2
      - name: Test and conformance
        working-directory: lmcpp
        run: ctest --test-dir build -V --output-on-failure
      - name: Install and find_package consumer
        working-directory: lmcpp
        shell: bash
        run: cmake -DBUILD_DIR=build -DJSON_PREFIX="$JSON_PREFIX" -DCMAKE_CXX_COMPILER=${{ inputs.cxx }} -P scripts/test-consumer.cmake

